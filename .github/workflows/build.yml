name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install exact project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade "flet-cli"

      - name: Verify Flet version
        run: |
          python -c "import flet; print('Flet:', getattr(flet, '__version__', 'unknown'))"
          flet --version

      - name: Build Android APK
        run: flet build apk --arch arm64-v8a --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: profsupport-apk
          path: build/apk/*.apk
          if-no-files-found: error
